[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecite"
version = "0.1.0"
description = "Citation-grounded RAG over the National Building Code of Canada, built on Cohere Embed + Rerank + Command"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishant Shah" }]
dependencies = [
    "cohere>=5.13",
    "pymupdf>=1.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
codecite = "codecite.cli:main"

[tool.setuptools.packages.find]
include = ["codecite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
